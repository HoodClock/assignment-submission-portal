<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Submission Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e17;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(255, 255, 255, 0.04);
      --text: #e6e9f0;
      --text-dim: #8b93a7;
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --green: #34d399;
      --red: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -25%;
      right: -10%;
      width: 500px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.7);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #fff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      margin: 0;
      color: var(--text-dim);
      font-size: 15px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      padding: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .card + .card { margin-top: 24px; }
    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    .card-title svg { color: var(--accent); }
    form { display: grid; gap: 18px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }
    input {
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input::placeholder { color: #555d70; }
    input:focus {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.06);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
    }
    button {
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      margin-top: 4px;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .message {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      animation: fadein 0.25s ease;
    }
    .message.show { display: block; }
    .message.success {
      color: var(--green);
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }
    .message.error {
      color: var(--red);
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .empty {
      text-align: center;
      color: var(--text-dim);
      font-size: 14px;
      padding: 28px 0 10px;
    }
    .submission-list { display: grid; gap: 12px; }
    .submission {
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.02);
      transition: border-color 0.2s;
      animation: fadein 0.3s ease;
    }
    .submission:hover { border-color: rgba(99, 102, 241, 0.4); }
    .submission-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 8px;
    }
    .submission-name { font-weight: 700; font-size: 15px; }
    .submission-date { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
    .submission-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    .chip.title { color: #c4b5fd; background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.2); }
    .submission a {
      color: #818cf8;
      font-size: 13px;
      text-decoration: none;
      word-break: break-all;
    }
    .submission a:hover { text-decoration: underline; color: #a5b4fc; }
    footer {
      text-align: center;
      margin-top: 32px;
      color: #4b5263;
      font-size: 12px;
    }
    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge"><span class="dot"></span>DevOps Lab — CI/CD Enabled</div>
      <h1>Assignment Submission Portal</h1>
      <p>Submit your assignment repository link below. All fields are validated and saved.</p>
    </header>

    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        New Submission
      </div>
      <form id="submission-form">
        <div class="row">
          <label>Name
            <input id="name" name="name" type="text" placeholder="e.g. Hamza Khan" autocomplete="name" />
          </label>
          <label>Registration Number
            <input id="registrationNumber" name="registrationNumber" type="text" placeholder="e.g. SP23-BCS-050" />
          </label>
        </div>
        <label>Assignment Title
          <input id="assignmentTitle" name="assignmentTitle" type="text" placeholder="e.g. Assignment-1 — Upgradeable Proxy" />
        </label>
        <label>Submission URL
          <input id="submissionUrl" name="submissionUrl" type="url" placeholder="https://github.com/username/repository" />
        </label>
        <button type="submit" id="submit-btn">Submit Assignment</button>
        <div id="form-message" class="message"></div>
      </form>
    </div>

    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Saved Submissions
      </div>
      <div id="submissions-status" class="empty">Loading submissions…</div>
      <div id="submission-list" class="submission-list" style="display:none;"></div>
    </div>

    <footer>Assignment Submission Portal · Node.js + Express · Tested with Jest · Deployed via GitHub Actions</footer>
  </div>

  <script>
    const form = document.getElementById('submission-form');
    const submitBtn = document.getElementById('submit-btn');
    const formMessage = document.getElementById('form-message');
    const submissionsStatus = document.getElementById('submissions-status');
    const submissionList = document.getElementById('submission-list');

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = String(value ?? '');
      return div.innerHTML;
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString(undefined, {
          day: 'numeric', month: 'short', year: 'numeric',
          hour: '2-digit', minute: '2-digit',
        });
      } catch {
        return iso;
      }
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = `message show ${type}`;
    }

    async function loadSubmissions() {
      const res = await fetch('/api/submissions');
      const submissions = await res.json();
      if (!Array.isArray(submissions) || submissions.length === 0) {
        submissionsStatus.style.display = 'block';
        submissionsStatus.textContent = 'No submissions yet. Be the first to submit.';
        submissionList.style.display = 'none';
        return;
      }
      submissionsStatus.style.display = 'none';
      submissionList.style.display = 'grid';
      submissionList.innerHTML = submissions.map((s) => `
        <div class="submission">
          <div class="submission-top">
            <span class="submission-name">${escapeHtml(s.name)}</span>
            <span class="submission-date">${escapeHtml(formatDate(s.submittedAt))}</span>
          </div>
          <div class="submission-meta">
            <span class="chip">${escapeHtml(s.registrationNumber)}</span>
            <span class="chip title">${escapeHtml(s.assignmentTitle)}</span>
          </div>
          <a href="${escapeHtml(s.submissionUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.submissionUrl)}</a>
        </div>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMessage.className = 'message';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';
      const payload = {
        name: document.getElementById('name').value.trim(),
        registrationNumber: document.getElementById('registrationNumber').value.trim(),
        assignmentTitle: document.getElementById('assignmentTitle').value.trim(),
        submissionUrl: document.getElementById('submissionUrl').value.trim(),
      };
      try {
        const res = await fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          showMessage('Submission saved successfully.', 'success');
          form.reset();
          await loadSubmissions();
        } else {
          const errors = data.errors || {};
          const messages = Object.values(errors).join(' · ');
          showMessage(messages || 'Submission rejected.', 'error');
        }
      } catch {
        showMessage('Network error. Is the server running?', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Assignment';
      }
    });

    loadSubmissions();
  </script>
</body>
</html>
