<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Submission Portal</title>
  <style>
    :root {
      --bg: #141517;
      --card: #1d1e21;
      --border: #2a2c30;
      --text: #e8eaed;
      --dim: #9aa0a6;
      --accent: #5865f2;
      --green: #23a55a;
      --red: #f23f43;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container { width: 100%; max-width: 640px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: var(--dim); font-size: 14px; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--dim); }
    input {
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input::placeholder { color: #5f6368; }
    input:focus { border-color: var(--accent); }
    button {
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4752c4; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .message.show { display: block; }
    .message.success { color: var(--green); background: rgba(35, 165, 90, 0.1); }
    .message.error { color: var(--red); background: rgba(242, 63, 67, 0.1); }
    .empty { color: var(--dim); font-size: 13px; }
    .item {
      padding: 12px 0;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
    .item:first-of-type { border-top: none; padding-top: 0; }
    .item-top { display: flex; justify-content: space-between; gap: 10px; }
    .item-name { font-weight: 600; }
    .item-date { color: var(--dim); font-size: 12px; white-space: nowrap; }
    .item-meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
    .item a { color: var(--accent); font-size: 13px; text-decoration: none; word-break: break-all; }
    .item a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Assignment Submission Portal</h1>
    <p class="sub">Enter your details and submission link below.</p>

    <div class="card">
      <form id="submission-form">
        <label>Name
          <input id="name" name="name" type="text" placeholder="Your name" />
        </label>
        <label>Registration Number
          <input id="registrationNumber" name="registrationNumber" type="text" placeholder="SP23-BCS-050" />
        </label>
        <label>Assignment Title
          <input id="assignmentTitle" name="assignmentTitle" type="text" placeholder="Assignment-1" />
        </label>
        <label>Submission URL
          <input id="submissionUrl" name="submissionUrl" type="url" placeholder="https://github.com/user/repo" />
        </label>
        <button type="submit" id="submit-btn">Submit</button>
        <div id="form-message" class="message"></div>
      </form>
    </div>

    <div class="card">
      <div id="submissions-status" class="empty">No submissions yet.</div>
      <div id="submission-list"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('submission-form');
    const submitBtn = document.getElementById('submit-btn');
    const formMessage = document.getElementById('form-message');
    const submissionsStatus = document.getElementById('submissions-status');
    const submissionList = document.getElementById('submission-list');

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = String(value ?? '');
      return div.innerHTML;
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString(undefined, {
          day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
        });
      } catch {
        return iso;
      }
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = `message show ${type}`;
    }

    async function loadSubmissions() {
      const res = await fetch('/api/submissions');
      const submissions = await res.json();
      if (!Array.isArray(submissions) || submissions.length === 0) {
        submissionsStatus.style.display = 'block';
        submissionList.style.display = 'none';
        return;
      }
      submissionsStatus.style.display = 'none';
      submissionList.style.display = 'block';
      submissionList.innerHTML = submissions.map((s) => `
        <div class="item">
          <div class="item-top">
            <span class="item-name">${escapeHtml(s.name)}</span>
            <span class="item-date">${escapeHtml(formatDate(s.submittedAt))}</span>
          </div>
          <div class="item-meta">${escapeHtml(s.registrationNumber)} &middot; ${escapeHtml(s.assignmentTitle)}</div>
          <a href="${escapeHtml(s.submissionUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.submissionUrl)}</a>
        </div>
      `).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMessage.className = 'message';
      submitBtn.disabled = true;
      const payload = {
        name: document.getElementById('name').value.trim(),
        registrationNumber: document.getElementById('registrationNumber').value.trim(),
        assignmentTitle: document.getElementById('assignmentTitle').value.trim(),
        submissionUrl: document.getElementById('submissionUrl').value.trim(),
      };
      try {
        const res = await fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          showMessage('Submission saved.', 'success');
          form.reset();
          await loadSubmissions();
        } else {
          const errors = data.errors || {};
          showMessage(Object.values(errors).join(' · ') || 'Submission rejected.', 'error');
        }
      } catch {
        showMessage('Network error.', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadSubmissions();
  </script>
</body>
</html>
