<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Submission Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1e1f22;
      --panel: #2b2d31;
      --panel-2: #313338;
      --border: rgba(255, 255, 255, 0.06);
      --blurple: #5865f2;
      --blurple-2: #7c5cff;
      --pink: #eb459e;
      --green: #23a55a;
      --red: #f23f43;
      --text: #f2f3f5;
      --dim: #b5bac1;
      --dimmer: #80848e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 18px 20px 14px;
      position: relative;
    }
    /* funky floating blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 480px; height: 480px; background: var(--blurple); top: -180px; left: -120px; animation: drift 14s ease-in-out infinite alternate; }
    .blob-2 { width: 380px; height: 380px; background: var(--pink); bottom: -160px; right: -100px; opacity: 0.3; animation: drift 18s ease-in-out infinite alternate-reverse; }
    .blob-3 { width: 260px; height: 260px; background: var(--blurple-2); bottom: 20%; left: 35%; opacity: 0.18; animation: drift 11s ease-in-out infinite alternate; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(50px, 35px) scale(1.08); }
    }

    header {
      flex: none;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .logo {
      width: 44px; height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blurple), var(--pink));
      display: grid;
      place-items: center;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.45);
    }
    .head-text h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .head-text p { font-size: 13px; color: var(--dim); margin-top: 2px; }
    .head-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
    }
    .head-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(35, 165, 90, 0.8);
    }
    .head-badge.offline .dot { background: var(--red); box-shadow: 0 0 8px rgba(242, 63, 67, 0.8); }

    main {
      flex: 1;
      min-height: 0;
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(320px, 400px) 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .panel-head {
      flex: none;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .panel-head .emoji { font-size: 16px; }
    .panel-head h2 { font-size: 14px; font-weight: 700; }
    .panel-head .count {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      color: var(--blurple);
      background: rgba(88, 101, 242, 0.14);
      padding: 3px 9px;
      border-radius: 999px;
    }
    .panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      scrollbar-width: thin;
      scrollbar-color: #4a4d55 transparent;
    }
    .panel-body::-webkit-scrollbar { width: 8px; }
    .panel-body::-webkit-scrollbar-thumb { background: #4a4d55; border-radius: 4px; }

    form { display: grid; gap: 15px; }
    label { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: 0.02em; }
    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--panel-2);
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: var(--dimmer); }
    input:focus {
      border-color: var(--blurple);
      box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.25);
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(120deg, var(--blurple), var(--blurple-2));
      box-shadow: 0 6px 18px rgba(88, 101, 242, 0.4);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }
    button:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 10px 26px rgba(88, 101, 242, 0.5); filter: brightness(1.1); }
    button:active { transform: translateY(0) scale(0.99); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .message {
      display: none;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
    }
    .message.show { display: block; animation: pop 0.25s ease; }
    .message.success { color: #3ddc84; background: rgba(35, 165, 90, 0.12); border: 1px solid rgba(35, 165, 90, 0.3); }
    .message.error { color: #ff8a8d; background: rgba(242, 63, 67, 0.1); border: 1px solid rgba(242, 63, 67, 0.3); }
    @keyframes pop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--dimmer);
      font-size: 14px;
      gap: 10px;
      align-content: center;
    }
    .empty .big { font-size: 42px; }

    /* chat-style submissions */
    .feed { display: flex; flex-direction: column; }
    .msg {
      display: flex;
      gap: 13px;
      padding: 12px 6px;
    }
    .msg + .msg { border-top: 1px solid rgba(255, 255, 255, 0.045); }
    .avatar {
      flex: none;
      width: 42px; height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
      color: #fff;
    }
    .msg-main { min-width: 0; flex: 1; }
    .msg-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .msg-name { font-weight: 700; font-size: 14.5px; }
    .msg-time { font-size: 11px; color: var(--dimmer); }
    .msg-sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
    .msg-sub b { color: var(--text); font-weight: 600; }
    .embed {
      margin-top: 8px;
      border-left: 3px solid var(--blurple);
      background: var(--panel-2);
      border-radius: 8px;
      padding: 9px 12px;
      max-width: 480px;
    }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .chip {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(88, 101, 242, 0.15);
      color: #a5b0ff;
    }
    .chip.pink { background: rgba(235, 69, 158, 0.14); color: #ff9ac7; }
    .embed a {
      font-size: 12.5px;
      color: #00a8fc;
      text-decoration: none;
      word-break: break-all;
    }
    .embed a:hover { text-decoration: underline; }

    footer {
      flex: none;
      position: relative;
      z-index: 1;
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--dimmer);
      padding: 0 4px;
    }
    footer span b { color: var(--dim); font-weight: 600; }
    @media (max-width: 860px) {
      body { overflow: auto; }
      main { grid-template-columns: 1fr; }
      .head-badge { display: none; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <header>
    <div class="logo">A</div>
    <div class="head-text">
      <h1>Assignment Portal</h1>
      <p>Drop your repo link. Get graded. No stress.</p>
    </div>
    <div class="head-badge" id="conn-badge"><span class="dot"></span><span id="conn-text">connecting…</span></div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <span class="emoji">📝</span>
        <h2>New Submission</h2>
      </div>
      <div class="panel-body">
        <form id="submission-form">
          <label>Name
            <input id="name" name="name" type="text" placeholder="What should we call you?" autocomplete="name" />
          </label>
          <label>Registration Number
            <input id="registrationNumber" name="registrationNumber" type="text" placeholder="SP23-BCS-050" />
          </label>
          <label>Assignment Title
            <input id="assignmentTitle" name="assignmentTitle" type="text" placeholder="Assignment-1" />
          </label>
          <label>Submission URL
            <input id="submissionUrl" name="submissionUrl" type="url" placeholder="https://github.com/you/your-repo" />
          </label>
          <button type="submit" id="submit-btn">Submit Assignment 🚀</button>
          <div id="form-message" class="message"></div>
        </form>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="emoji">📥</span>
        <h2>Submission Feed</h2>
        <span class="count" id="feed-count">0</span>
      </div>
      <div class="panel-body">
        <div id="submissions-status" class="empty">
          <div class="big">📭</div>
          <div>No submissions yet — be the first to drop yours!</div>
        </div>
        <div id="submission-list" class="feed" style="display:none;"></div>
      </div>
    </section>
  </main>

  <footer>
    <span><b>Assignment Portal</b> · Node.js + Express · Jest-tested · CI/CD via GitHub Actions</span>
    <span id="submissions-total"></span>
  </footer>

  <script>
    const form = document.getElementById('submission-form');
    const submitBtn = document.getElementById('submit-btn');
    const formMessage = document.getElementById('form-message');
    const submissionsStatus = document.getElementById('submissions-status');
    const submissionList = document.getElementById('submission-list');
    const connBadge = document.getElementById('conn-badge');
    const connText = document.getElementById('conn-text');
    const feedCount = document.getElementById('feed-count');
    const submissionsTotal = document.getElementById('submissions-total');

    const AVATAR_COLORS = ['#5865f2', '#eb459e', '#23a55a', '#f0b232', '#00a8fc', '#ff7a45', '#9b59b6'];

    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = String(value ?? '');
      return div.innerHTML;
    }

    function initials(name) {
      return String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
    }

    function colorFor(name) {
      let h = 0;
      for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) % 997;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }

    function formatDate(iso) {
      try {
        return new Date(iso).toLocaleString(undefined, {
          day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
        });
      } catch {
        return iso;
      }
    }

    function showMessage(text, type) {
      formMessage.textContent = text;
      formMessage.className = `message show ${type}`;
    }

    async function loadSubmissions() {
      try {
        const res = await fetch('/api/submissions');
        const submissions = await res.json();
        const list = Array.isArray(submissions) ? submissions : [];
        connBadge.classList.remove('offline');
        connText.textContent = 'API online';
        feedCount.textContent = list.length;
        submissionsTotal.textContent = list.length ? `total submissions: ${list.length}` : '';
        if (list.length === 0) {
          submissionsStatus.style.display = 'grid';
          submissionList.style.display = 'none';
          return;
        }
        submissionsStatus.style.display = 'none';
        submissionList.style.display = 'flex';
        submissionList.innerHTML = list.map((s) => `
          <div class="msg">
            <div class="avatar" style="background:${colorFor(s.name)}">${escapeHtml(initials(s.name))}</div>
            <div class="msg-main">
              <div class="msg-top">
                <span class="msg-name">${escapeHtml(s.name)}</span>
                <span class="msg-time">${escapeHtml(formatDate(s.submittedAt))}</span>
              </div>
              <div class="msg-sub">submitted <b>${escapeHtml(s.assignmentTitle)}</b></div>
              <div class="embed">
                <div class="chips">
                  <span class="chip">${escapeHtml(s.registrationNumber)}</span>
                  <span class="chip pink">assignment</span>
                </div>
                <a href="${escapeHtml(s.submissionUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.submissionUrl)}</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch {
        connBadge.classList.add('offline');
        connText.textContent = 'API offline';
        submissionsStatus.style.display = 'grid';
        submissionsStatus.innerHTML = '<div class="big">🔌</div><div>Can\'t reach the server — is <b>npm start</b> running?</div>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formMessage.className = 'message';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';
      const payload = {
        name: document.getElementById('name').value.trim(),
        registrationNumber: document.getElementById('registrationNumber').value.trim(),
        assignmentTitle: document.getElementById('assignmentTitle').value.trim(),
        submissionUrl: document.getElementById('submissionUrl').value.trim(),
      };
      try {
        const res = await fetch('/api/submissions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          showMessage('Submission saved. You\'re all set! 🎉', 'success');
          form.reset();
          await loadSubmissions();
        } else {
          const errors = data.errors || {};
          const messages = Object.values(errors).join(' · ');
          showMessage(messages || 'Submission rejected.', 'error');
        }
      } catch {
        showMessage('Network error — server unreachable.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Assignment 🚀';
      }
    });

    loadSubmissions();
  </script>
</body>
</html>
