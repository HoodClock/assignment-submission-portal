name: Assignment Portal CI

on:
  push:
    branches:
      - main
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests and generate JSON report
        run: npx jest --json > test-results.json

      - name: Send test report to local receiver
        if: always()
        run: node scripts/send-report.js
        env:
          REPORT_RECEIVER_URL: ${{ secrets.LOCAL_REPORT_RECEIVER_URL }}

      - name: Send test report by email
        if: always()
        run: node scripts/send-report-email.js
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: warn

  deploy:
    name: Deploy static frontend to GitHub Pages
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
